<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board to Life</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="2.5" y="5.5" width="27" height="19" rx="3" />
          <path d="M8 19c3-5 6-7 9-6s4 3 7-2" />
          <path d="M13 28.5h6" />
        </svg>
        Board to Life
      </span>
      <ol class="steps" aria-label="Steps">
        <li data-step="capture">Bring in the board</li>
        <li data-step="check">Check the reading</li>
        <li data-step="present">Present</li>
      </ol>
      <span class="display-actions">
        <button id="fullscreen" type="button" class="quiet" hidden>Full screen</button>
        <button id="board-mode" type="button" aria-pressed="false">Board mode</button>
      </span>
      <label class="stub" hidden>
        Stub mode
        <select id="stub-mode" aria-label="Stub mode">
          <option value="ok">ok</option>
          <option value="error">error</option>
          <option value="timeout">timeout</option>
          <option value="invalid">invalid scene</option>
          <option value="ungrounded">ungrounded draft</option>
          <option value="backward">backward arrow</option>
        </select>
      </label>
    </header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
